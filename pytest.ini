[pytest]
# Collect only Fargo's own tests. _ref/ holds shallow clones of sibling repos
# (NAPA, APA-Scraper, ...) that ship their OWN pytest suites; without this, a bare
# `pytest` from the repo root would recurse into them (slow, and their tests can
# fail in a shallow clone). CI and local runs key on this.
testpaths = tests
norecursedirs = _ref basket .git .github __pycache__ .venv venv
