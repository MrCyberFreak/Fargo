name: fargo-resolve-apa

# Batch resolver for the APA roster source. Reads the name queue produced by
# `import_apa.py crossref` (committed at docs/resolve/apa_to_resolve.json) and
# searches FargoRate for each name, keeping only CO matches. Writes a review file
# (docs/resolve/apa_resolution.json) and commits it — it adds NOTHING to
# roster.json. Resolved matches are reviewed by a human before any are added.
#
# This is the network half of the APA import; the sandbox can't reach
# fargorate.com (see CLAUDE.md "Where things run"), so it runs on a runner.
# ~2,000+ names at ~1s each -> allow plenty of wall-clock.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fargo-resolve-apa
  cancel-in-progress: false

jobs:
  resolve-apa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Resolve APA names to FargoRate ids (CO only)
        run: python src/import_apa.py resolve

      - name: Commit resolution review file
        run: |
          git add docs/resolve/apa_resolution.json
          if ! git diff --cached --quiet; then
            git config user.name  "fargo-tracker[bot]"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "resolve(apa): stage FargoRate resolution for review"
            git push
          else
            echo "Nothing to commit."
          fi
