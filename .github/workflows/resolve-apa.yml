name: fargo-resolve-apa

# Batch resolver for the APA roster source. Reads the name queue produced by
# `import_apa.py crossref` (committed at docs/resolve/apa_to_resolve.json),
# searches FargoRate for each name (CO-preferred, single out-of-state matches
# admitted, nickname-variant fallback for zero-hit names), then auto-adds the
# exact-name single matches to roster.json. Writes the review file
# docs/resolve/apa_resolution.json (resolved / variant_candidates / ambiguous /
# unfound); variant + ambiguous matches are staged there for human review, NOT
# auto-added. Commits both files.
#
# This is the network half of the APA import; the sandbox can't reach
# fargorate.com (see CLAUDE.md "Where things run"), so it runs on a runner.
# ~2,000+ base searches plus variant retries on the zero-hit names, ~1s each
# -> allow plenty of wall-clock.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fargo-resolve-apa
  cancel-in-progress: false

jobs:
  resolve-apa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Resolve APA names to FargoRate ids (CO-preferred + variants)
        run: python src/import_apa.py resolve

      - name: Add exact-name single matches to roster.json
        run: python src/import_apa.py add

      - name: Commit resolution review file + roster additions
        run: |
          git add docs/resolve/apa_resolution.json roster.json
          if ! git diff --cached --quiet; then
            git config user.name  "fargo-tracker[bot]"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "resolve(apa): auto-add exact matches; stage variant/ambiguous for review"
            # main can advance during the long resolve run; rebase-and-retry so a
            # non-fast-forward push doesn't discard the work (see pull.yml).
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/${GITHUB_REF_NAME}"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep 5
            done
          else
            echo "Nothing to commit."
          fi
