name: fargo-pull

# Scheduled rating pull. Runs deterministic Python on a runner (open internet),
# appends any baseline/change rows to data/history.csv, and commits them back.
# No LLM/agent runs here.

on:
  schedule:
    # 13:17 UTC daily. ~7:17am Denver in daylight time, ~6:17am in standard
    # time — early morning year-round. GitHub cron is fixed UTC and does NOT
    # follow DST, so the local time shifts an hour across the changeover (fine
    # here). Off the :00/:30 marks on purpose to dodge congested cron slots.
    # Cron is best-effort (5-30 min lag is normal). workflow_dispatch below
    # stays for manual runs.
    - cron: '17 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Avoid overlapping runs stepping on each other's commit/push.
concurrency:
  group: fargo-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # ~1,182 rostered players fetched sequentially at ~1s courtesy delay each is
    # ~20-30 min every run (the pull fetches all players daily, not just changed
    # ones). Was 15; raised with headroom for roster growth (NAPA/APA imports).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python src/pull.py

      - name: Commit changes if any
        run: |
          # Stage first, then check the *staged* diff: `git diff` alone ignores
          # untracked files, so a brand-new data/history.csv (the baseline run)
          # would otherwise look like "no changes".
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git config user.name  "fargo-tracker[bot]"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "data: rating/robustness changes $(date -u +%F)"
            # The pull runs ~30 min; `main` can advance during that window (PR
            # merges, other workflows), making a bare push non-fast-forward and
            # throwing away the run's data. Rebase our single data commit onto
            # the latest remote and retry. history.csv is append-only and the
            # competing commits are code/docs/roster, so the rebase won't conflict.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep 5
            done
          fi
